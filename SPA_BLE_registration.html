<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('/SPA-BLE/sw.js', {scope: '/SPA-BLE/'})
      .then(reg => console.log('SPA-BLE offline service worker registered', reg.scope))
      .catch(err => console.warn('SPA-BLE offline caching unavailable', err));
  });
}
</script>
