<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Smart Power Attenuator</title>
<style>
  * { box-sizing: border-box; font-family: Arial, sans-serif; font-weight: bold; }
  body { margin: 0; padding: 14px; font-size: 18px; background: #fff; color: #000; }
  h1 { font-size: 26px; margin: 4px 0 12px; }
  h2 { font-size: 21px; margin: 14px 0 9px; }
  .status-connect-row { display: flex; align-items: stretch; gap: 10px; margin-bottom: 10px; }
  .current-status { display: flex; flex-direction: column; align-items: flex-start; gap: 4px; width: fit-content; max-width: 100%; padding: 8px 10px; border: 1px solid #000; border-radius: 5px; }
  #connectionButton { white-space: nowrap; align-self: stretch; height: auto; margin: 0; }
  .status-item { display: inline-flex; align-items: baseline; gap: 4px; white-space: nowrap; }
  .status-label { text-align: left; }
  .status-value { text-align: left; }
  @media (max-width: 480px) {
    .status-connect-row { gap: 7px; }
    .current-status { gap: 4px; padding: 7px 8px; font-size: 14px; }
    #connectionButton { padding-left: 8px; padding-right: 8px; }
    .status-item { gap: 3px; }
  }
  .ble-state { display: flex; align-items: center; margin: 0; min-width: 0; }
  .connection { display: flex; gap: 8px; flex-wrap: wrap; margin: 8px 0; }
  button { font-size: 18px; min-height: 44px; padding: 8px 13px; border: 1px solid #000; border-radius: 5px; background: #f2f2f2; color: #000; }
  button:disabled { opacity: .45; }
  .message { font-size: 17px; padding: 7px 0 4px; line-height: 1.3; }
  .error { color: #b00000; }
  table { width: 172px; table-layout: fixed; border-collapse: collapse; }
  th, td { border: 1px solid #000; padding: 5px 6px; text-align: left; }
  th:first-child, td:first-child { text-align: center; width: 64px; max-width: 64px; white-space: nowrap; padding-left: 2px; padding-right: 2px; }
  th:last-child, td:last-child { text-align: center; }
  td:nth-child(2), th:nth-child(2) { width: 108px; max-width: 108px; white-space: nowrap; padding: 0 2px; overflow: hidden; }
  .band-button { width: 100%; min-height: 40px; padding: 6px 5px; }
  input[type=number] { width: 68px; height: 42px; font-size: 18px; padding: 5px; border: 1px solid #000; border-radius: 4px; text-align: center; }
  .row-controls { display: flex; align-items: center; gap: 6px; }
  .stepper { display: flex; flex-direction: column; gap: 2px; }
  .stepper button { min-height: 19px; height: 19px; width: 28px; padding: 0; font-size: 13px; line-height: 15px; touch-action: manipulation; -webkit-user-select: none; user-select: none; }

  .attenuation-grid { display: flex; align-items: flex-start; gap: 10px; width: fit-content; max-width: 100%; }
  .attenuation-panel { width: 172px; flex: 0 0 172px; }
  .attenuation-panel table { width: 172px; }
  .submit-cell { height: 53px; display: flex; align-items: center; justify-content: center; }
  .submit-cell button { width: 100%; }
  @media (max-width: 380px) {
    .attenuation-grid { gap: 6px; }
    .attenuation-panel { width: 168px; flex-basis: 168px; }
    .attenuation-panel table { width: 168px; }
  }
  .bypass-row { margin: 7px 0 10px; }
  .bypass-row input { width: 22px; height: 22px; vertical-align: middle; }
  .delay-row { display: flex; align-items: stretch; gap: 8px; flex-wrap: nowrap; }
  .delay-row label { display: inline-block; min-width: 118px; }
  .save-row { margin-top: 10px; }
  .footer { font-size: 15px; font-weight: normal; margin-top: 10px; line-height: 1.35; }
  @media (max-width: 380px) {
    body { padding: 10px; }
    h1 { font-size: 24px; }
    h2 { font-size: 20px; }
    button, input[type=number] { font-size: 17px; }
    th, td { padding: 4px; }
  }
  #saveDelaysButton { white-space: nowrap; align-self: stretch; height: auto; margin: 0; }

  .delay-save-layout { display:flex; align-items:stretch; gap:8px; }
  .delay-fields { display:flex; flex-direction:column; gap:6px; }
  .delay-save-layout .delay-row { display:flex; align-items:center; gap:6px; }
  .delay-save-layout #saveDelaysButton { white-space:nowrap; align-self:stretch; height:auto; margin:0; }

  @media (max-width:480px) {
    body { padding:10px; font-size:16px; }
    h1 { font-size:24px; margin:3px 0 9px; }
    h2 { font-size:19px; margin:10px 0 6px; }
    .status-connect-row { gap:6px; margin-bottom:7px; }
    .current-status { gap:3px; padding:6px 8px; font-size:14px; }
    #connectionButton { min-height:0; padding:6px 9px; font-size:16px; }
    .bypass-row { margin:5px 0; }
    th, td { padding:3px 5px; }
    button { min-height:39px; padding:6px 10px; font-size:16px; }
    input[type=number] { font-size:16px; }
    .attenuation-grid { gap:8px; }
    .submit-cell { margin-top:5px; }
    .delay-save-layout { gap:7px; }
    .delay-fields { gap:5px; }
    .delay-save-layout .delay-row { gap:5px; }
    .footer { margin-top:6px; font-size:13px; }
  }

  /* iPhone viewport-fit overrides: use the available screen instead of fixed spacing. */
  @media (max-width:480px) {
    html, body {
      width:100%;
      max-width:100%;
      min-height:100%;
      margin:0;
      overflow-x:hidden;
    }

    body {
      min-height:100dvh;
      padding:
        max(7px, env(safe-area-inset-top))
        max(8px, env(safe-area-inset-right))
        max(6px, env(safe-area-inset-bottom))
        max(8px, env(safe-area-inset-left));
      display:flex;
      flex-direction:column;
    }

    h1 {
      font-size:clamp(21px, 5.8vw, 24px);
      margin:1px 0 clamp(4px, .8dvh, 8px);
      line-height:1.05;
    }

    h2 {
      font-size:clamp(17px, 4.6vw, 19px);
      margin:clamp(5px, .9dvh, 9px) 0 clamp(3px, .55dvh, 6px);
      line-height:1.05;
    }

    .status-connect-row {
      width:100%;
      gap:clamp(4px, 1.4vw, 7px);
      margin-bottom:clamp(3px, .6dvh, 6px);
    }

    .current-status {
      flex:1 1 auto;
      width:auto;
      min-width:0;
      padding:clamp(4px, .65dvh, 6px) clamp(6px, 1.8vw, 9px);
      font-size:clamp(13px, 3.7vw, 15px);
      gap:clamp(1px, .3dvh, 3px);
    }

    #connectionButton {
      flex:0 0 auto;
      min-height:0;
      padding:4px clamp(7px, 2vw, 10px);
      font-size:clamp(14px, 4vw, 16px);
    }

    .bypass-row {
      margin:clamp(2px, .45dvh, 5px) 0;
    }

    .attenuation-grid {
      width:100%;
      display:grid;
      grid-template-columns:minmax(0,1fr) minmax(0,1fr);
      gap:clamp(5px, 1.7vw, 9px);
    }

    .attenuation-grid > * {
      min-width:0;
      width:100%;
    }

    table {
      width:100%;
      table-layout:fixed;
    }

    th, td {
      padding:clamp(1px, .28dvh, 3px) clamp(3px, 1vw, 5px);
      font-size:clamp(13px, 3.7vw, 15px);
      line-height:1.05;
    }

    button {
      min-height:clamp(31px, 4.7dvh, 39px);
      padding:clamp(3px, .55dvh, 6px) clamp(6px, 2vw, 10px);
      font-size:clamp(14px, 4vw, 16px);
      line-height:1.05;
    }

    input[type=number] {
      font-size:clamp(14px, 4vw, 16px);
      min-height:clamp(31px, 4.7dvh, 39px);
    }

    .submit-cell {
      margin-top:clamp(2px, .45dvh, 5px);
    }

    .delay-save-layout {
      width:100%;
      gap:clamp(5px, 1.7vw, 8px);
    }

    .delay-fields {
      flex:1 1 auto;
      min-width:0;
      gap:clamp(3px, .5dvh, 5px);
    }

    .delay-save-layout .delay-row {
      width:100%;
      gap:clamp(3px, 1vw, 5px);
    }

    .delay-save-layout #saveDelaysButton {
      flex:0 0 auto;
      align-self:stretch;
      height:auto;
    }

    .footer {
      margin-top:clamp(3px, .55dvh, 6px);
      font-size:clamp(11px, 3.1vw, 13px);
      line-height:1.05;
    }
  }

  /* On short iPhone browser viewports, tighten only the vertical dimension. */
  @media (max-width:480px) and (max-height:750px) {
    body { padding-top:max(5px, env(safe-area-inset-top)); padding-bottom:max(4px, env(safe-area-inset-bottom)); }
    h1 { margin-bottom:3px; }
    h2 { margin-top:4px; margin-bottom:2px; }
    .status-connect-row { margin-bottom:2px; }
    th, td { padding-top:1px; padding-bottom:1px; }
    button, input[type=number] { min-height:30px; }
    .footer { margin-top:2px; }
  }


  /* iPhone comfort-fit overrides: retain full-width use while restoring tap space. */
  @media (max-width:480px) {
    /* More breathing room vertically, without recreating wasted side space. */
    body {
      padding-left:max(6px, env(safe-area-inset-left));
      padding-right:max(6px, env(safe-area-inset-right));
    }

    h1 { margin-bottom:8px; }
    h2 { margin-top:10px; margin-bottom:7px; }

    .status-connect-row {
      gap:7px;
      margin-bottom:7px;
    }

    .bypass-row { margin:6px 0; }

    /* Use nearly all horizontal space; keep only a narrow center gutter. */
    .attenuation-grid {
      width:100%;
      grid-template-columns:minmax(0,1fr) minmax(0,1fr);
      column-gap:4px;
      row-gap:0;
    }

    .attenuation-grid > * {
      width:100%;
      min-width:0;
      margin:0;
    }

    table {
      width:100%;
      margin:0;
    }

    /* Restore comfortable band-row spacing and tap targets. */
    th, td {
      padding:4px 4px;
      line-height:1.15;
    }

    button {
      min-height:40px;
      padding-top:6px;
      padding-bottom:6px;
    }

    input[type=number] {
      min-height:40px;
    }

    .stepper button {
      min-height:20px;
      padding-top:2px;
      padding-bottom:2px;
    }

    .submit-cell { margin-top:6px; }

    /* PTT labels sit directly beside their controls with no artificial gap. */
    .delay-save-layout {
      width:100%;
      display:flex;
      align-items:stretch;
      gap:4px;
    }

    .delay-fields {
      flex:0 1 auto;
      gap:6px;
    }

    .delay-save-layout .delay-row {
      display:grid;
      grid-template-columns:max-content max-content;
      align-items:center;
      column-gap:2px;
      width:max-content;
    }

    .delay-save-layout .delay-row label {
      margin:0;
      padding:0;
      white-space:nowrap;
    }

    .delay-save-layout .row-controls {
      margin:0;
    }

    /* Fill recovered width and finish close to the delay arrow controls. */
    .delay-save-layout #saveDelaysButton {
      flex:1 1 auto;
      min-width:0;
      margin:0;
      align-self:stretch;
      height:auto;
      padding-left:10px;
      padding-right:10px;
    }

    .footer { margin-top:7px; }
  }

  /* Short screens still keep useful tap targets; only trim non-interactive gaps. */
  @media (max-width:480px) and (max-height:750px) {
    h1 { margin-bottom:5px; }
    h2 { margin-top:7px; margin-bottom:5px; }
    .status-connect-row { margin-bottom:5px; }
    .bypass-row { margin:4px 0; }
    th, td { padding-top:3px; padding-bottom:3px; }
    button, input[type=number] { min-height:38px; }
    .stepper button { min-height:19px; }
    .delay-fields { gap:5px; }
    .footer { margin-top:4px; }
  }


  @media (max-width:480px) {
    .delay-save-layout .delay-fields {
      flex:0 0 auto;
      width:auto;
      min-width:0;
    }

    .delay-save-layout .delay-row {
      display:flex;
      flex-direction:row;
      align-items:center;
      justify-content:flex-start;
      width:auto;
      min-width:0;
      gap:2px;
      margin:0;
      padding:0;
    }

    .delay-save-layout .delay-row label {
      display:inline-block;
      flex:0 0 auto;
      width:auto !important;
      min-width:0 !important;
      margin:0 !important;
      padding:0 !important;
      white-space:nowrap;
    }

    .delay-save-layout .delay-row .row-controls {
      display:inline-flex !important;
      flex:0 0 auto;
      width:auto !important;
      min-width:0 !important;
      margin:0 !important;
      padding:0 !important;
    }

    .delay-save-layout #saveDelaysButton {
      flex:1 1 auto;
      margin-left:2px;
    }
  }


  /* Align all major control groups to the same right-hand page edge. */
  @media (max-width:480px) {
    .status-connect-row,
    .attenuation-grid,
    .delay-save-layout {
      width:100% !important;
      max-width:100% !important;
      margin-left:0 !important;
      margin-right:0 !important;
    }

    /* Current Band/Attenuation box grows so BLE Connect finishes at grid edge. */
    .status-connect-row .current-status {
      flex:1 1 auto;
      width:auto !important;
      min-width:0;
    }

    .status-connect-row #connectionButton {
      flex:0 0 auto;
      margin-right:0 !important;
    }

    /* Make each attenuation half consume exactly half of the usable width. */
    .attenuation-grid {
      grid-template-columns:minmax(0,1fr) minmax(0,1fr) !important;
      column-gap:4px !important;
    }

    .attenuation-grid > div,
    .attenuation-grid table {
      width:100% !important;
      max-width:none !important;
      margin-left:0 !important;
      margin-right:0 !important;
    }

    /* Submit All container/button follows the right edge of its second column. */
    .attenuation-grid .submit-cell {
      width:100% !important;
      max-width:none !important;
      margin-right:0 !important;
    }

    .attenuation-grid #submitAllButton {
      width:100% !important;
      max-width:none !important;
      margin-right:0 !important;
    }

    /* Delay controls stay compact at left; Save Delays fills to identical edge. */
    .delay-save-layout .delay-fields {
      flex:0 0 auto;
    }

    .delay-save-layout #saveDelaysButton {
      flex:1 1 auto;
      width:auto !important;
      max-width:none !important;
      margin-right:0 !important;
    }
  }

</style>
</head>
<body>
<h1>Smart Power Attenuator</h1>

<div class="status-connect-row">
  <div class="current-status">
    <span class="status-item"><span class="status-label">Current Band:</span><span id="currentBand" class="status-value">Connect to view</span></span>
    <span class="status-item"><span class="status-label">Attenuation:</span><span id="currentAttn" class="status-value">Connect to view</span></span>
  </div>
  <button id="connectionButton">BLE Connect</button>
</div>


<h2>TX Attenuation by Band (0 - 15 dB)</h2>

<div class="bypass-row">
  <input id="bypass" type="checkbox">
  <label for="bypass">Bypass SPA Attn (TX) Path</label>
</div>

<div class="attenuation-grid">
  <div class="attenuation-panel">
    <table>
      <colgroup><col style="width:64px"><col style="width:108px"></colgroup>
      <thead><tr><th>Band</th><th>Attn (dB)</th></tr></thead>
      <tbody id="bandTableLeft"></tbody>
    </table>
  </div>

  <div class="attenuation-panel">
    <table>
      <colgroup><col style="width:64px"><col style="width:108px"></colgroup>
      <thead><tr><th>Band</th><th>Attn (dB)</th></tr></thead>
      <tbody id="bandTableRight"></tbody>
    </table>
    <div class="submit-cell">
      <button type="button" id="submitAllButton" disabled>Submit All</button>
    </div>
  </div>
</div>

<h2>PTT Delay Settings (0 - 250 mS)</h2>
<div class="delay-save-layout">
  <div class="delay-fields">
    <div class="delay-row">
      <label for="delay1">PTT OUT 1:</label>
      <span class="row-controls" style="display:inline-flex;vertical-align:middle;">
        <input id="delay1" type="number" min="0" max="250" value="0" inputmode="numeric" enterkeyhint="done">
        <span class="stepper">
          <button type="button" onclick="stepDelay(1,1)">▲</button>
          <button type="button" onclick="stepDelay(1,-1)">▼</button>
        </span>
      </span>
    </div>
    <div class="delay-row">
      <label for="delay2">PTT OUT 2:</label>
      <span class="row-controls" style="display:inline-flex;vertical-align:middle;">
        <input id="delay2" type="number" min="0" max="250" value="0" inputmode="numeric" enterkeyhint="done">
        <span class="stepper">
          <button type="button" onclick="stepDelay(2,1)">▲</button>
          <button type="button" onclick="stepDelay(2,-1)">▼</button>
        </span>
      </span>
    </div>
  </div>
  <button type="button" id="saveDelaysButton" disabled>Save Delays</button>
</div>

<div class="footer">
  BLE status is refreshed automatically every second while connected.
</div>

<script>
const SERVICE_UUID = '6e400001-b5a3-f393-e0a9-e50e24dcca9e';
const COMMAND_UUID = '6e400002-b5a3-f393-e0a9-e50e24dcca9e';
const STATUS_UUID  = '6e400003-b5a3-f393-e0a9-e50e24dcca9e';
const BANDS = ['160m','80m','60m','40m','30m','20m','17m','15m','12m','10m','6m'];

let device = null;
let server = null;
let commandCharacteristic = null;
let statusCharacteristic = null;
let statusPollTimer = null;
let pendingMessage = null;
let messageClearTimer = null;
let pendingTimeoutTimer = null;
const attnDirty = new Array(BANDS.length).fill(false);
const delayDirty = [false, false];

const $ = id => document.getElementById(id);

let bleConnected = false;

function renderBleConnectionState() {
  $('connectionButton').textContent = bleConnected ? 'BLE Connected' : 'BLE Connect';
  $('connectionButton').className = '';
  $('connectionButton').title = bleConnected ? 'SPA-BLE connected' : 'SPA-BLE disconnected';
}

function setMessage(text, isError = false, clearAfterMs = 0) {
  if (messageClearTimer) {
    clearTimeout(messageClearTimer);
    messageClearTimer = null;
  }

  // Keep the compact layout: command/result feedback is available as the
  // connection button tooltip rather than using a separate BLE status row.
  $('connectionButton').title = text || (bleConnected ? 'SPA-BLE connected' : 'SPA-BLE disconnected');

  if (clearAfterMs > 0) {
    messageClearTimer = setTimeout(function() {
      renderBleConnectionState();
      messageClearTimer = null;
    }, clearAfterMs);
  }
}

function armPendingTimeout() {
  if (pendingTimeoutTimer) clearTimeout(pendingTimeoutTimer);
  pendingTimeoutTimer = setTimeout(function() {
    pendingTimeoutTimer = null;
    if (pendingMessage !== null) {
      pendingMessage = null;
      setMessage('');
    }
  }, 2000);
}

function clearPendingMessage() {
  if (pendingMessage === null) return;

  const message = pendingMessage;
  pendingMessage = null;

  if (pendingTimeoutTimer) {
    clearTimeout(pendingTimeoutTimer);
    pendingTimeoutTimer = null;
  }

  if (message.type === 'attn') {
    setMessage(message.band + ' set to ' + message.value + ' dB', false, 2000);
  } else if (message.type === 'delay') {
    setMessage('PTT OUT ' + message.which + ' delay set to ' + message.value + ' ms', false, 2000);
  } else if (message.type === 'bypass') {
    setMessage(message.value === '1' ? 'Bypass ON' : 'Bypass OFF', false, 2000);
  } else if (message.type === 'submitAll') {
    setMessage('All attenuation values saved', false, 2000);
  } else if (message.type === 'delays') {
    setMessage('PTT delays saved', false, 2000);
  }
}

function setConnected(connected) {
  $('connectionButton').textContent = connected ? 'BLE Connected' : 'BLE Connect';
  $('submitAllButton').disabled = !connected;
  $('saveDelaysButton').disabled = !connected;
  bleConnected = connected;
  renderBleConnectionState();
  if (!connected) {
    $('currentBand').textContent = 'Connect to view';
    $('currentAttn').textContent = 'Connect to view';
  }
}

function buildBandTable() {
  const leftBody = $('bandTableLeft');
  const rightBody = $('bandTableRight');

  BANDS.forEach((band, i) => {
    const tbody = i < 6 ? leftBody : rightBody;
    const tr = document.createElement('tr');

    tr.innerHTML =
      '<td><button type="button" class="band-button" id="band-' + i +
      '" onclick="sendAttn(' + i + ')">' + band + '</button></td>' +
      '<td><div class="row-controls">' +
      '<input id="attn-' + i + '" type="number" min="0" max="15" value="15" ' +
      'inputmode="numeric" enterkeyhint="done">' +
      '<div class="stepper">' +
      '<button type="button" onclick="stepAttn(' + i + ',1)">▲</button>' +
      '<button type="button" onclick="stepAttn(' + i + ',-1)">▼</button>' +
      '</div></div></td>';

    tbody.appendChild(tr);

    const input = $('attn-' + i);
    input.addEventListener('input', () => { attnDirty[i] = true; });

    // iPhone numeric keyboards may dismiss with Done without generating
    // a keydown Enter event. The change event commits the edited value.
    input.addEventListener('change', async () => {
      if (attnDirty[i]) {
        await sendAttn(i);
      }
    });

    // Keep Enter support for desktop and browsers that do generate Enter.
    input.addEventListener('keydown', async event => {
      if (event.key === 'Enter') {
        event.preventDefault();
        await sendAttn(i);
        input.blur();
      }
    });
  });
}

function stepAttn(index, amount) {
  const input = $('attn-' + index);
  let v = Number(input.value);
  if (!Number.isFinite(v)) v = 15;
  input.value = Math.max(0, Math.min(15, v + amount));
  input.dispatchEvent(new Event('input', { bubbles: true }));
}

function stepDelay(which, amount) {
  const input = $('delay' + which);
  let v = Number(input.value);
  if (!Number.isFinite(v)) v = 0;
  input.value = Math.max(0, Math.min(250, v + amount));
  delayDirty[which - 1] = true;
}

function validNumber(id, min, max) {
  const input = $(id);
  const value = Number(input.value);
  if (!Number.isInteger(value) || value < min || value > max) {
    input.focus();
    setMessage('Please enter a value from ' + min + ' to ' + max + '.', true);
    return null;
  }
  return value;
}

async function connectBLE() {
  if (!navigator.bluetooth) {
    setMessage('Web Bluetooth is not available in this browser.', true);
    return;
  }

  try {
    renderBleConnectionState();
    device = await navigator.bluetooth.requestDevice({
      filters: [{ name: 'SPA-BLE' }],
      optionalServices: [SERVICE_UUID]
    });

    device.addEventListener('gattserverdisconnected', disconnected);
    server = await device.gatt.connect();

    const service = await server.getPrimaryService(SERVICE_UUID);
    commandCharacteristic = await service.getCharacteristic(COMMAND_UUID);
    statusCharacteristic = await service.getCharacteristic(STATUS_UUID);

    await statusCharacteristic.startNotifications();
    statusCharacteristic.addEventListener('characteristicvaluechanged', handleStatusNotification);

    setConnected(true);
    startStatusPolling();
  } catch (err) {
    setConnected(false);
    setMessage('BLE connection failed: ' + err.message, true);
  }
}

function disconnected() {
  stopStatusPolling();
  pendingMessage = null;
  setConnected(false);
  commandCharacteristic = null;
  statusCharacteristic = null;
  server = null;
  renderBleConnectionState();
}

async function disconnectBLE() {
  try {
    if (device && device.gatt && device.gatt.connected) device.gatt.disconnect();
  } catch (err) {}
  disconnected();
}

function startStatusPolling() {
  stopStatusPolling();
  requestStatus();
  statusPollTimer = setInterval(requestStatus, 1000);
}

function stopStatusPolling() {
  if (statusPollTimer !== null) {
    clearInterval(statusPollTimer);
    statusPollTimer = null;
  }
}

async function requestStatus() {
  if (commandCharacteristic) {
    await sendCommand('GET');
  }
}

async function sendCommand(command) {
  if (!commandCharacteristic) {
    setMessage('Connect to SPA-BLE first.', true);
    return false;
  }
  try {
    const data = new TextEncoder().encode(command);
    if (commandCharacteristic.writeValueWithoutResponse) {
      await commandCharacteristic.writeValueWithoutResponse(data);
    } else {
      await commandCharacteristic.writeValue(data);
    }
    return true;
  } catch (err) {
    setMessage('BLE write failed: ' + err.message, true);
    return false;
  }
}

function parseStatus(text) {
  const fields = {};
  text.split(';').forEach(part => {
    const eq = part.indexOf('=');
    if (eq > 0) fields[part.substring(0, eq)] = part.substring(eq + 1);
  });

  if (fields.BAND !== undefined) $('currentBand').textContent = fields.BAND;
  if (fields.ATTN !== undefined) $('currentAttn').textContent = fields.ATTN + ' dB';

  if (fields.BYPASS !== undefined) {
    const on = fields.BYPASS === '1';
    $('bypass').checked = on;
  }

  if (fields.DELAY1 !== undefined && !delayDirty[0]) {
    $('delay1').value = fields.DELAY1;
  }
  if (fields.DELAY2 !== undefined && !delayDirty[1]) {
    $('delay2').value = fields.DELAY2;
  }

  if (fields.ATTNS !== undefined) {
    fields.ATTNS.split(',').forEach(item => {
      const parts = item.split(':');
      if (parts.length !== 2) return;
      const i = BANDS.indexOf(parts[0]);
      if (i >= 0 && !attnDirty[i]) $('attn-' + i).value = parts[1];
    });
  } else if (fields.BAND !== undefined && fields.ATTN !== undefined) {
    const i = BANDS.indexOf(fields.BAND);
    if (i >= 0 && !attnDirty[i]) $('attn-' + i).value = fields.ATTN;
  }

  clearPendingMessage();
}

function handleStatusNotification(event) {
  const text = new TextDecoder().decode(event.target.value);
  parseStatus(text);
}

async function sendAttn(index) {
  const value = validNumber('attn-' + index, 0, 15);
  if (value === null) return false;
  const command = 'ATTN=' + BANDS[index] + ',' + value;
  if (await sendCommand(command)) {
    attnDirty[index] = false;
    pendingMessage = { type: 'attn', band: BANDS[index], value: value };
    armPendingTimeout();
    setMessage('Setting ' + BANDS[index] + ' to ' + value + ' dB...');
    return true;
  }
  return false;
}

async function sendAllAttn() {
  if (!commandCharacteristic) {
    setMessage('Connect to SPA-BLE first.', true);
    return;
  }

  const button = $('submitAllButton');
  button.disabled = true;

  try {
    const allValues = [];
    for (let i = 0; i < BANDS.length; i++) {
      const value = validNumber('attn-' + i, 0, 15);
      if (value === null) {
        setMessage('Submit All cancelled: invalid value for ' + BANDS[i] + '.', true);
        return;
      }
      allValues.push(value);
    }

    for (let i = 0; i < BANDS.length; i++) {
      if (!await sendCommand('SAVEATTN=' + BANDS[i] + ',' + allValues[i])) {
        setMessage('Submit All failed while saving ' + BANDS[i] + '.', true);
        return;
      }
      attnDirty[i] = false;
      await new Promise(resolve => setTimeout(resolve, 75));
    }

    pendingMessage = { type: 'submitAll' };
    armPendingTimeout();
    setMessage('Submitting all attenuation values...');
    await sendCommand('GET');
  } finally {
    button.disabled = !commandCharacteristic;
  }
}


async function sendDelay(which) {
  const id = which === 1 ? 'delay1' : 'delay2';
  const value = validNumber(id, 0, 250);
  if (value === null) return false;

  const command = 'DELAY' + which + '=' + value;

  if (await sendCommand(command)) {
    delayDirty[which - 1] = false;

    pendingMessage = {
      type: 'delay',
      which: which,
      value: value
    };

    armPendingTimeout();

    setMessage(
      'Setting PTT OUT ' +
      which +
      ' delay to ' +
      value +
      ' ms...'
    );

    // Request confirmation without blocking the command path.
    await new Promise(resolve => setTimeout(resolve, 75));
    await sendCommand('GET');
    return true;
  }

  return false;
}

async function saveDelays() {
  if (!commandCharacteristic) {
    setMessage('Connect to SPA-BLE first.', true);
    return;
  }

  const d1 = validNumber('delay1', 0, 250);
  if (d1 === null) return;

  const d2 = validNumber('delay2', 0, 250);
  if (d2 === null) return;

  const button = $('saveDelaysButton');
  button.disabled = true;

  try {
    if (!await sendCommand('DELAY1=' + d1)) return;
    await new Promise(resolve => setTimeout(resolve, 75));

    if (!await sendCommand('DELAY2=' + d2)) return;

    delayDirty[0] = false;
    delayDirty[1] = false;

    pendingMessage = { type: 'delays' };
    armPendingTimeout();
    setMessage('Saving PTT delays...');
    await new Promise(resolve => setTimeout(resolve, 75));
    await sendCommand('GET');
  } finally {
    button.disabled = !commandCharacteristic;
  }
}

async function sendBypass() {
  if (!commandCharacteristic) { setMessage('Connect to SPA-BLE first.', true); return; }
  const value = $('bypass').checked ? '1' : '0';
  if (await sendCommand('BYPASS=' + value)) {
    pendingMessage = { type: 'bypass', value: value };
    armPendingTimeout();
    setMessage(value === '1' ? 'Bypass ON...' : 'Bypass OFF...');
  }
}

$('connectionButton').addEventListener('click', async function() {
  if (bleConnected) {
    disconnectBLE();
  } else {
    await connectBLE();
  }
});
$('submitAllButton').addEventListener('click', sendAllAttn);
$('saveDelaysButton').addEventListener('click', saveDelays);
$('bypass').addEventListener('change', sendBypass);

$('delay1').addEventListener('input', () => { delayDirty[0] = true; });
$('delay2').addEventListener('input', () => { delayDirty[1] = true; });

$('delay1').addEventListener('change', async function() {
  if (!delayDirty[0]) return;
  await sendDelay(1);
});

$('delay1').addEventListener('keydown', async event => {
  if (event.key === 'Enter') {
    event.preventDefault();
    await sendDelay(1);
    $('delay1').blur();
  }
});
$('delay2').addEventListener('change', async function() {
  if (!delayDirty[1]) return;
  await sendDelay(2);
});

$('delay2').addEventListener('keydown', async event => {
  if (event.key === 'Enter') {
    event.preventDefault();
    await sendDelay(2);
    $('delay2').blur();
  }
});

buildBandTable();
setConnected(false);
</script>
</body>
</html>
